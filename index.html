<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>結の札｜静かな図書館の奥、あなたの物語がひらく</title>
<style>
/* =========================================================
   YUI NO FUDA - GENTLE LIBRARY EDITION (Design Refresh)
   ========================================================= */
:root {
  /* カラーパレットの調整 (より温かく、優しいトーンへ) */
  --navy: #2c3e50; /* 少し暗めに */
  --navy-deep: #1a252f;
  --navy-soft: #4a637d;

  --paper: #fffaf0; /* 真っ白からクリーム系へ */
  --paper-light: #fffef5;
  --paper-dark: #f5eeda; /* 少し濃いクリーム */

  --ink: #423930; /* 墨色を少し茶系に */
  --muted: #8a7b6e;

  --gold: #b89438; /* ゴールドを少し渋く */
  --gold-light: #e8dcc8;
  --gold-accent: #d4c091;

  --rose: #c97378;
  --rose-light: #f0e1df;

  --line: #e0d6c2;

  --shadow: 0 10px 30px rgba(74, 99, 125, 0.1); /* 影を柔らかく */
  --shadow-deep: 0 20px 50px rgba(74, 99, 125, 0.15);

  /* フォント設定の調整 */
  --serif: "游明朝", YuMincho, "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif;
  --sans-serif: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif); /* 基本をセリフ体に */
  line-height: 2.0; /* 行間を少し広めに */
  letter-spacing: .05em;
}

button, a {
  font: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

img {
  max-width: 100%;
  display: block;
}

/* =========================================================
   COMMON
   ========================================================= */
.screen {
  min-height: 100vh;
}

.container {
  width: min(980px, calc(100% - 40px)); /* 横幅を少しコンパクトに */
  margin: 0 auto;
}

.fade {
  animation: fadeIn 1.2s ease both; /* フェードインをゆっくりに */
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* =========================================================
   ENTRANCE (ロマンチックに)
   ========================================================= */
#entrance {
  position: relative;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: white;
  background: radial-gradient(circle at 50% 40%, rgba(212,192,145,0.15), transparent 70%), linear-gradient(165deg, #354a5e 0%, #213242 100%);
}

#entrance::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .07;
  background-image: radial-gradient(rgba(255,255,255,0.4) 1px, transparent 1px);
  background-size: 30px 30px;
  pointer-events: none;
}

.entrance-inner {
  position: relative;
  z-index: 2;
  width: min(600px, calc(100% - 40px));
  text-align: center;
  padding: 40px 0;
}

.entrance-image {
  width: min(220px, 60vw);
  margin: 0 auto 40px;
  position: relative;
  filter: drop-shadow(0 10px 30px rgba(0,0,0,0.2));
}

.entrance-image::before {
  content: "";
  position: absolute;
  inset: -15px;
  border: 1px solid rgba(212,192,145,0.4);
  border-radius: 50%;
}

.entrance-image img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 50%;
  border: 4px solid white;
}

.entrance-kicker {
  color: #e0c98a;
  font-size: 12px;
  letter-spacing: .4em;
  margin-bottom: 12px;
  font-family: var(--sans-serif);
}

.entrance-title {
  margin: 0;
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(28px, 6vw, 40px);
  line-height: 1.5;
  letter-spacing: .1em;
  text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}

.entrance-subtitle {
  margin: 25px 0 40px;
  color: rgba(255,255,255,0.85);
  font-size: 15px;
  line-height: 2.1;
  font-weight: 300;
}

.enter-button {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 200px;
  padding: 16px 30px;
  border: 1px solid var(--gold-accent);
  border-radius: 50px;
  background: var(--gold-accent);
  color: var(--navy-deep);
  font-weight: 500;
  letter-spacing: .15em;
  font-family: var(--sans-serif);
  box-shadow: 0 10px 25px rgba(212,192,145,0.25);
  transition: all .4s ease;
}

.enter-button:hover {
  background: rgba(212,192,145,0.15);
  color: white;
  transform: translateY(-3px);
  box-shadow: 0 15px 35px rgba(212,192,145,0.35);
}

.entrance-note {
  margin-top: 30px;
  color: rgba(255,255,255,0.4);
  font-size: 11px;
  letter-spacing: .1em;
  font-family: var(--sans-serif);
}

/* =========================================================
   LIBRARY
   ========================================================= */
#library {
  display: none;
  background: var(--paper);
}
#library.active {
  display: block;
}

/* HEADER (落ち着いた上品さ) */
.library-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255, 250, 240, 0.92); /* 背景色を半透明に */
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}

.header-inner {
  width: min(980px, calc(100% - 40px));
  height: 65px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  border: 0;
  background: none;
  color: var(--navy);
  font-family: var(--serif);
  font-size: 18px;
  letter-spacing: .15em;
  text-align: left;
  line-height: 1.2;
  padding: 0;
  transition: opacity .3s;
}
.logo:hover { opacity: 0.7; }

.logo small {
  display: block;
  font-family: var(--sans-serif);
  color: var(--gold);
  font-size: 8px;
  letter-spacing: .25em;
}

.nav {
  display: flex;
  gap: 25px;
}

.nav button {
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 13px;
  letter-spacing: .05em;
  font-family: var(--sans-serif);
  transition: color .3s, transform .3s;
  padding: 0;
}
.nav button:hover {
  color: var(--gold);
}

/* HERO (静寂な雰囲気) */
.library-hero {
  position: relative;
  min-height: 420px;
  display: flex;
  align-items: center;
  overflow: hidden;
  background: linear-gradient(180deg, var(--paper-dark) 0%, var(--paper) 100%);
  text-align: center;
}

.hero-content {
  position: relative;
  z-index: 2;
  width: min(650px, 100%);
  margin: auto;
  padding: 40px 0;
}

.hero-label {
  color: var(--gold);
  font-size: 11px;
  letter-spacing: .35em;
  margin-bottom: 15px;
  font-weight: 500;
  font-family: var(--sans-serif);
}

.hero-title {
  margin: 0;
  color: var(--navy);
  font-family: var(--serif);
  font-size: clamp(32px, 7vw, 54px);
  font-weight: 300;
  letter-spacing: .2em;
}

.hero-rule {
  width: 50px;
  height: 1px;
  background: var(--gold);
  margin: 25px auto;
}

.hero-copy {
  margin: 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 15px;
  line-height: 2.3;
  font-weight: 300;
}

/* SECTION (見出しをオシャレに) */
.section {
  padding: 80px 20px;
}

.section-heading {
  text-align: center;
  margin-bottom: 60px;
}

.section-heading small {
  display: block;
  color: var(--gold);
  font-size: 10px;
  letter-spacing: .35em;
  margin-bottom: 15px;
  font-weight: 500;
  font-family: var(--sans-serif);
  text-transform: uppercase;
}

.section-heading h2 {
  margin: 0;
  color: var(--navy);
  font-family: var(--serif);
  font-size: clamp(24px, 4vw, 32px);
  font-weight: 300;
  letter-spacing: .15em;
  position: relative;
  display: inline-block;
}

.section-heading h2::before,
.section-heading h2::after {
  content: "✧";
  color: var(--gold-accent);
  font-size: 20px;
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
}
.section-heading h2::before { left: -35px; }
.section-heading h2::after { right: -35px; }

/* BOOKSHELF EXPLORATION (可愛く) */
.shelf-section {
  background: var(--paper-light);
}

.shelf-intro {
  text-align: center;
  max-width: 500px;
  margin: 0 auto 40px;
  color: var(--muted);
  font-size: 14px;
  line-height: 2.0;
  font-weight: 300;
}

.bookshelf-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); /* カードサイズを大きく */
  gap: 30px;
  max-width: 800px;
  margin: 0 auto;
}

.shelf-card {
  background: white;
  border: 1px solid var(--line);
  padding: 35px 25px;
  text-align: center;
  border-radius: 12px; /* 角を丸く */
  transition: all .5s ease;
  cursor: pointer;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}

.shelf-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(212,192,145,0.15) 0%, transparent 50%);
  opacity: 0;
  transition: opacity .5s;
}

.shelf-card:hover {
  transform: translateY(-8px) scale(1.02); /* 浮遊感を強調 */
  border-color: var(--gold-accent);
  box-shadow: var(--shadow-deep);
}
.shelf-card:hover::after {
  opacity: 1;
}

.shelf-card-icon {
  font-size: 40px; /* アイコンを大きく */
  margin-bottom: 15px;
  line-height: 1;
  filter: drop-shadow(0 2px 5px rgba(0,0,0,0.1));
}

.shelf-card-title {
  color
