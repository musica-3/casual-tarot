<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>結の札｜夜の図書館</title>
<style>
:root {
  --navy: #132230;
  --navy-2: #1b2f42;
  --navy-3: #274158;
  --paper: #f8f5ec;
  --paper-2: #fffdf9;
  --paper-3: #efe8d5;
  --ink: #38322c;
  --muted: #7b7165;
  --gold: #ad8d4c;
  --gold-light: #d8c397;
  --gold-glow: rgba(173, 141, 76, 0.18);
  --line: #d3c7b1;
  --serif: "Yu Mincho", YuMincho, "Hiragino Mincho ProN", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Yu Gothic", sans-serif;
  --shadow: 0 14px 40px rgba(19,34,48,.12);
  --shadow-deep: 0 24px 60px rgba(19,34,48,.18);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  line-height: 2.2;
  letter-spacing: .06em;
}
button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.container { width: min(920px, calc(100% - 40px)); margin: 0 auto; }
.fade { animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) both; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-8px) rotate(1deg); }
}
#entrance {
  position: relative;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: white;
  background: radial-gradient(circle at 50% 35%, rgba(216,195,151,.16), transparent 45%), linear-gradient(155deg, var(--navy-3), var(--navy));
}
.entrance-inner { position: relative; z-index: 2; width: min(620px, calc(100% - 40px)); padding: 45px 0; text-align: center; }
.entrance-book {
  width: min(180px, 45vw);
  height: min(230px, 58vw);
  margin: 0 auto 40px;
  position: relative;
  animation: float 7s ease-in-out infinite;
  filter: drop-shadow(0 20px 32px rgba(0,0,0,.35));
}
.book-cover {
  position: absolute;
  inset: 0;
  border-radius: 4px 14px 14px 4px;
  background: linear-gradient(135deg, #9a7536, #5e4420);
  border: 1px solid rgba(255,255,255,.22);
  box-shadow: inset 8px 0 0 rgba(0,0,0,.15), inset -3px 0 0 rgba(255,255,255,.15);
}
.book-cover::before {
  content: "結";
  position: absolute;
  left: 50%;
  top: 42%;
  transform: translate(-50%,-50%);
  color: rgba(255,250,235,.95);
  font-size: 50px;
  font-weight: 300;
}
.gold-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 200px;
  padding: 14px 28px;
  border: 1px solid var(--gold-light);
  border-radius: 50px;
  background: var(--gold-light);
  color: var(--navy);
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: .15em;
  transition: all .4s cubic-bezier(0.16, 1, 0.3, 1);
}
.gold-button:hover {
  transform: translateY(-3px);
  background: transparent;
  color: white;
  border-color: white;
}
#library { display: none; }
#library.active { display: block; }
.library-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(248,245,236,.88);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.header-inner { width: min(920px, calc(100% - 36px)); height: 68px; margin: auto; display: flex; align-items: center; justify-content: space-between; }
.logo { padding: 0; border: 0; background: none; color: var(--navy); font-size: 17px; letter-spacing: .15em; text-align: left; }
.nav { display: flex; gap: 24px; }
.nav button { padding: 8px 0; border: 0; background: none; color: var(--muted); font-family: var(--sans); font-size: 11px; }
.library-hero {
  min-height: 460px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: radial-gradient(circle at 50% 30%, rgba(173,141,76,.1), transparent 48%), linear-gradient(180deg, var(--paper-3), var(--paper));
}
.section { padding: 85px 20px; }
.section-heading { text-align: center; margin-bottom: 50px; }
.section-heading h2 { margin: 0; color: var(--navy); font-size: clamp(22px, 4.5vw, 30px); font-weight: 300; letter-spacing: .15em; }
.bookshelf { max-width: 820px; margin: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.book-card {
  padding: 28px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: linear-gradient(180deg, #fffefd, #f5efdf);
  box-shadow: var(--shadow);
  text-align: center;
  cursor: pointer;
  transition: transform .4s cubic-bezier(0.16, 1, 0.3, 1);
}
.book-card:hover { transform: translateY(-8px); border-color: var(--gold); }
.book-spine {
  width: 46px; height: 105px; margin: 0 auto 22px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 3px 6px 6px 3px;
  background: linear-gradient(90deg, #24394b, #3c566e);
  color: rgba(255,255,255,.92);
  writing-mode: vertical-rl;
  font-size: 11px;
}
#room-result, #draw-result { display: none; }
.story-card { max-width: 700px; margin: auto; padding: 48px; background: white; border: 1px solid var(--line); border-radius: 14px; text-align: center; box-shadow: var(--shadow-deep); }
.draw-section { background: var(--paper-3); text-align: center; }
.draw-stage {
  width: 310px; height: 310px; margin: 35px auto 45px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--gold-light); border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.85), rgba(239,232,213,.75));
}
.draw-button {
  width: 130px; height: 130px; border: 1px solid rgba(255,255,255,.25); border-radius: 50%;
  background: var(--navy); color: white; font-size: 14px; letter-spacing: .15em;
}
footer { padding: 40px 20px; background: var(--navy); color: rgba(255,255,255,.5); text-align: center; font-size: 9px; font-family: var(--sans); }
@media (max-width: 700px) { .bookshelf { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<section id="entrance">
  <div class="entrance-inner fade">
    <div class="entrance-book"><div class="book-cover"></div></div>
    <div style="font-family:var(--sans); font-size:10px; letter-spacing:.4em; color:var(--gold-light); margin-bottom:14px;">NIGHT LIBRARY</div>
    <h1 style="font-size:clamp(34px, 8.5vw, 52px); font-weight:300; letter-spacing:.18em; margin:0;">結の札</h1>
    <p style="color:rgba(255,255,255,.8); font-size:14px; margin:24px auto 38px;">夜の図書館へ、ようこそ。<br>今夜はその中から一冊だけ、物語を開いてみてください。</p>
    <button class="gold-button" onclick="enterLibrary()">図書館に入る</button>
  </div>
</section>

<div id="library">
  <header class="library-header">
    <div class="header-inner">
      <button class="logo" onclick="window.scrollTo({top:0, behavior:'smooth'})">結の札</button>
      <nav class="nav">
        <button onclick="document.getElementById('bookshelf').scrollIntoView({behavior:'smooth'})">本棚</button>
        <button onclick="document.getElementById('draw-section').scrollIntoView({behavior:'smooth'})">一枚読む</button>
      </nav>
    </div>
  </header>

  <section class="library-hero">
    <div class="container fade">
      <h2 style="color:var(--navy); font-weight:300; font-size:32px; letter-spacing:.18em;">夜の本棚</h2>
      <p style="color:var(--muted); font-size:14px;">気になる本を、一冊選んでみてください。</p>
    </div>
  </section>

  <section id="bookshelf" class="section">
    <div class="container">
      <div class="section-heading"><h2>気になる本を選ぶ</h2></div>
      <div class="bookshelf">
        <article class="book-card" onclick="openRoom('quiet')">
          <div class="book-spine">静寂</div>
          <div style="color:var(--navy); font-size:15px; margin-bottom:10px;">静かな夜</div>
          <div style="color:var(--muted); font-size:10px;">今日は少し、<br>何もしない時間。</div>
        </article>
        <article class="book-card" onclick="openRoom('star')">
          <div class="book-spine">星影</div>
          <div style="color:var(--navy); font-size:15px; margin-bottom:10px;">星を数える</div>
          <div style="color:var(--muted); font-size:10px;">これからのことを、<br>少しだけ考える夜。</div>
        </article>
      </div>
    </div>
  </section>

  <section id="room-result" class="section">
    <div class="container">
      <div class="story-card fade">
        <h3 id="story-title" style="color:var(--navy); font-size:22px; margin-bottom:20px;">物語</h3>
        <div id="story-text" style="color:var(--ink); text-align:left; font-size:13.5px; line-height:2.45;">本を開きました。</div>
        <div style="margin-top:32px;"><button class="gold-button" onclick="document.getElementById('bookshelf').scrollIntoView({behavior:'smooth'})">本棚へ戻る</button></div>
      </div>
    </div>
  </section>

  <section id="draw-section" class="section draw-section">
    <div class="container">
      <div class="section-heading"><h2>今夜の一枚</h2></div>
      <div class="draw-stage">
        <button class="draw-button" onclick="drawCard()">一枚読む</button>
      </div>
      <div id="draw-result" style="margin-top:40px;">
        <div class="story-card fade">
          <h3 id="draw-title" style="color:var(--navy); font-size:22px; margin-bottom:20px;">今夜の一枚</h3>
          <div id="draw-text" style="color:var(--ink); text-align:left; font-size:13.5px; line-height:2.45;"></div>
        </div>
      </div>
    </div>
  </section>

  <footer><p>© 結の札</p></footer>
</div>

<script>
const roomData = {
  quiet: { title: "今日は、何もしない本", story: "ページをめくる音だけが聞こえる部屋です。今日は何かを決めなくてもいい。" },
  star: { title: "星を数える本", story: "窓の向こうに、いくつかの星が見えます。遠くにあるものは、今すぐ手に入れなくても大丈夫。" }
};

const cards = [
  { title: "女帝", text: "今日は、少し甘やかしていい日。美味しいものを食べたり、好きな音楽を聴いたりする時間は大切です。" },
  { title: "魔術師", text: "完璧な準備を待つより、とりあえず一つ触ってみる。そんな小さな始め方もあります。" }
];

function enterLibrary() {
  document.getElementById("entrance").style.display = "none";
  document.getElementById("library").classList.add("active");
  window.scrollTo(0,0);
}

function openRoom(type) {
  const data = roomData[type];
  if (!data) return;
  document.getElementById("story-title").textContent = data.title;
  document.getElementById("story-text").textContent = data.story;
  document.getElementById("room-result").style.display = "block";
  document.getElementById("room-result").scrollIntoView({behavior:'smooth'});
}

function drawCard() {
  const card = cards[Math.floor(Math.random() * cards.length)];
  document.getElementById("draw-title").textContent = card.title;
  document.getElementById("draw-text").textContent = card.text;
  document.getElementById("draw-result").style.display = "block";
  document.getElementById("draw-result").scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
