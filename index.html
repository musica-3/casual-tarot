<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>結の札</title>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #fffdf9;
            --text-main: #3a3835;
            --text-sub: #7a756f;
            --accent-warm: #d4836f;
            --border-color: #e3ded6;
            --shadow: 0 10px 30px rgba(58, 56, 53, 0.05);
            --transition-smooth: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.8;
            letter-spacing: 0.05em;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            padding: 40px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .screen {
            display: none;
            width: 100%;
            opacity: 0;
            transform: translateY(15px);
            transition: var(--transition-smooth);
            text-align: center;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 1;
            transform: translateY(0);
        }

        /* --- 1. トップ画面 (図書館の入り口・小さな気配) --- */
        .top-message {
            font-size: 1.1rem;
            color: var(--text-sub);
            margin-bottom: 32px;
            font-weight: 300;
        }

        .ticket-box {
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            padding: 48px 32px;
            border-radius: 12px;
            width: 100%;
            box-shadow: var(--shadow);
            position: relative;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .ticket-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(58, 56, 53, 0.08);
            border-color: var(--accent-warm);
        }

        .ticket-box h1 {
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .ticket-box p {
            font-size: 0.95rem;
            color: var(--text-sub);
        }

        .hint-badge {
            display: inline-block;
            margin-top: 32px;
            font-size: 0.85rem;
            color: var(--accent-warm);
            background: rgba(212, 131, 111, 0.08);
            padding: 6px 16px;
            border-radius: 20px;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* --- 2 & 3. 札を選ぶ・引く・見る --- */
        .card-container {
            perspective: 1000px;
            width: 240px;
            height: 360px;
            margin: 0 auto 32px auto;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            box-shadow: var(--shadow);
            border-radius: 8px;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            border-radius: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        .card-back {
            background: #e8e4dc;
            color: var(--text-sub);
            justify-content: center;
            align-items: center;
            border: 1px dashed var(--border-color);
        }

        .card-front {
            transform: rotateY(180deg);
            text-align: left;
            border-top: 4px solid var(--accent-warm);
        }

        .card-number {
            font-size: 0.75rem;
            color: var(--text-sub);
            letter-spacing: 0.2em;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .card-scene {
            font-size: 0.9rem;
            color: var(--text-main);
            line-height: 1.7;
            font-weight: 300;
        }

        .card-footer-note {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-align: right;
        }

        /* --- 4 & 5. 考える・物語の中を歩く --- */
        .reflection-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 32px;
            border-radius: 8px;
            margin-bottom: 32px;
            width: 100%;
            text-align: left;
            box-shadow: var(--shadow);
        }

        .reflection-box p {
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .reflection-box p:last-child {
            margin-bottom: 0;
            color: var(--text-sub);
            font-size: 0.9rem;
            border-left: 2px solid var(--accent-warm);
            padding-left: 12px;
        }

        /* --- 6. 現実へ戻るアクション --- */
        .action-area {
            display: flex;
            gap: 16px;
            justify-content: center;
            width: 100%;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--text-main);
            color: var(--text-main);
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            letter-spacing: 0.05em;
        }

        .btn:hover {
            background: var(--text-main);
            color: var(--card-bg);
        }

        .btn-sub {
            border-color: var(--border-color);
            color: var(--text-sub);
        }

        .btn-sub:hover {
            border-color: var(--text-sub);
            background: transparent;
            color: var(--text-main);
        }

        /* フッター */
        footer {
            padding: 24px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-sub);
            letter-spacing: 0.1em;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 16px;
            }
            .card-container {
                width: 210px;
                height: 320px;
            }
            .ticket-box {
                padding: 36px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ① 世界観に入る ＆ 導入 -->
        <div id="screen-top" class="screen active">
            <p class="top-message">今日は、どんな札かな。</p>
            <div class="ticket-box" id="start-btn">
                <h1>結の札</h1>
                <p>ちょっと見ていく？</p>
                <div class="hint-badge">一枚引いてみる</div>
            </div>
        </div>

        <!-- ② ③ ④ ⑤ カードを見る・考える・物語を歩く -->
        <div id="screen-card" class="screen">
            <p class="top-message" id="prompt-text">このカード、なんか気になる。</p>
            
            <div class="card-container" id="card-element">
                <div class="card-inner">
                    <!-- 裏面 -->
                    <div class="card-face card-back">
                        <span>✦</span>
                        <p style="font-size: 0.85rem; letter-spacing: 0.2em;">結</p>
                        <span>✦</span>
                    </div>
                    <!-- 表面 -->
                    <div class="card-face card-front">
                        <div>
                            <div class="card-number" id="c-num">No. 01</div>
                            <div class="card-title" id="c-title">タイトル</div>
                        </div>
                        <div class="card-scene" id="c-scene">
                            情景がここに浮かびます。
                        </div>
                        <div class="card-footer-note">少し寄り道。</div>
                    </div>
                </div>
            </div>

            <div class="action-area" id="action-before-open">
                <button class="btn" id="open-btn">札をめくる</button>
                <button class="btn btn-sub" id="back-home-1">やめる</button>
            </div>

            <div class="reflection-box" id="reflection-box" style="display: none;">
                <p id="c-reflection">ここに問いかけが入ります。</p>
                <p id="c-thought">急がなくても、大丈夫。</p>
            </div>

            <!-- ⑥ 現実へ戻る -->
            <div class="action-area" id="action-after-open" style="display: none;">
                <button class="btn" id="return-btn">じゃあ、そろそろ帰ろう。</button>
            </div>
        </div>

    </div>

    <footer>
        結の札
    </footer>

    <script>
        const cardsData = [
            {
                num: "No. 03",
                title: "遠くの鐘",
                scene: "どこからか、夕方の鐘の音が聞こえる。風が少しだけ冷たくなって、上着のポケットに手を入れた。",
                reflection: "最近、ひとつのことに夢中になりすぎて、まわりの景色が見えなくなっていませんでしたか。",
                thought: "たまには足を止めて、深呼吸をひとつ。"
            },
            {
                num: "No. 07",
                title: "水たまりの空",
                scene: "雨上がりのアスファルト。足元をふと見下ろすと、そこには現実とは違う、静かな青空が広がっていた。",
                reflection: "見慣れた日常のなかに、小さな別世界が隠れていることに気づく瞬間があります。",
                thought: "今日はいつもと違う道を歩いてみるのもいいかも。"
            },
            {
                num: "No. 12",
                title: "古い切符",
                scene: "引き出しの奥から、いつどこで買ったかも忘れてしまった、小さな電車の切符が出てきた。",
                reflection: "忘れていた昔の約束や、昔の自分が大切にしていた気持ちを、ふと思い出す日。",
                thought: "過去の自分に、ちょっと挨拶をしてみる。"
            },
            {
                num: "No. 15",
                title: "重たいコート",
                scene: "ずっと着続けていたコートを脱いだら、体が驚くほど軽くなった。春はもうすぐそこまで来ている。",
                reflection: "そろそろ手放してもいい荷物を、ずっと抱えていませんでしたか。",
                thought: "軽くなった肩で、明日へ。"
            },
            {
                num: "No. 21",
                title: "夜の窓辺",
                scene: "静まり返った部屋。マグカップから立ち上る湯気を眺めながら、今日一日の出来事をゆっくりと整理する。",
                reflection: "今日もよく頑張りました。うまくできたことも、できなかったことも、すべて今日という物語のひとコマ。",
                thought: "あたたかい飲み物を飲んで、眠りにつこう。"
            }
        ];

        const startBtn = document.getElementById('start-btn');
        const screenTop = document.getElementById('screen-top');
        const screenCard = document.getElementById('screen-card');
        const cardElement = document.getElementById('card-element');
        const openBtn = document.getElementById('open-btn');
        const backHome1 = document.getElementById('back-home-1');
        const returnBtn = document.getElementById('return-btn');
        
        const actionBeforeOpen = document.getElementById('action-before-open');
        const actionAfterOpen = document.getElementById('action-after-open');
        const reflectionBox = document.getElementById('reflection-box');
        const promptText = document.getElementById('prompt-text');

        const cNum = document.getElementById('c-num');
        const cTitle = document.getElementById('c-title');
        const cScene = document.getElementById('c-scene');
        const cReflection = document.getElementById('c-reflection');
        const cThought = document.getElementById('c-thought');

        let currentCard = null;
        let isFlipped = false;

        function setupRandomCard() {
            const randomIndex = Math.floor(Math.random() * cardsData.length);
            currentCard = cardsData[randomIndex];
            
            cNum.textContent = currentCard.num;
            cTitle.textContent = currentCard.title;
            cScene.textContent = currentCard.scene;
            cReflection.textContent = currentCard.reflection;
            cThought.textContent = currentCard.thought;

            cardElement.classList.remove('flipped');
            isFlipped = false;
            reflectionBox.style.display = 'none';
            actionBeforeOpen.style.display = 'flex';
            actionAfterOpen.style.display = 'none';
            promptText.textContent = "このカード、なんか気になる。";
        }

        startBtn.addEventListener('click', () => {
            setupRandomCard();
            screenTop.classList.remove('active');
            setTimeout(() => {
                screenTop.style.display = 'none';
                screenCard.style.display = 'flex';
                setTimeout(() => {
                    screenCard.classList.add('active');
                }, 50);
            }, 600);
        });

        function flipCard() {
            if (isFlipped) return;
            cardElement.classList.add('flipped');
            isFlipped = true;
            promptText.textContent = "物語の中へ、少しだけ入ってみる。";

            setTimeout(() => {
                reflectionBox.style.display = 'block';
                actionBeforeOpen.style.display = 'none';
                actionAfterOpen.style.display = 'flex';
            }, 600);
        }

        openBtn.addEventListener('click', flipCard);
        cardElement.addEventListener('click', () => {
            if (!isFlipped) flipCard();
        });

        function goHome() {
            screenCard.classList.remove('active');
            setTimeout(() => {
                screenCard.style.display = 'none';
                screenTop.style.display = 'flex';
                setTimeout(() => {
                    screenTop.classList.add('active');
                }, 50);
            }, 600);
        }

        backHome1.addEventListener('click', goHome);
        returnBtn.addEventListener('click', goHome);
    </script>
</body>
</html>
